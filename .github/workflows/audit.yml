name: Rust dependency audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    name: Check vulnerable crates
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SQLx records its optional MySQL RSA dependency in Cargo.lock.
          # Adelia enables PostgreSQL only; rsa is absent from the build graph.
          ignore: RUSTSEC-2023-0071
