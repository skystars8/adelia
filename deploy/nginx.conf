upstream adelia_app {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name community.example.org;
    root /opt/adelia/generated;
    index index.html;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    access_log off;
    error_log /dev/null crit;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;

    location /assets/ {
        alias /opt/adelia/web/assets/;
        expires 1h;
    }

    location /media/ {
        alias /opt/adelia/data/uploads/;
        expires 1y;
    }

    location ~ ^/(post|actions)$ {
        proxy_pass http://adelia_app;
    }

    location ^~ /mod {
        proxy_pass http://adelia_app;
    }

    location ^~ /banner/ {
        proxy_pass http://adelia_app;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://adelia_app;
        access_log off;
    }

    location / {
        expires -1;
        try_files $uri $uri/ @rust_fallback;
    }

    location @rust_fallback {
        proxy_pass http://adelia_app;
    }
}
