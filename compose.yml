name: adelia

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adelia
      POSTGRES_USER: adelia
      POSTGRES_PASSWORD: adelia-local-development-only
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adelia -d adelia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://adelia:adelia-local-development-only@database:5432/adelia
      APP_SECRET: docker-development-secret-change-this-before-any-real-deployment
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      DEVELOPMENT_MODE: "false"
      SITE_TITLE: Adelia
      SITE_SUBTITLE: Independent discussion for hobby and educational communities
      SECURE_COOKIES: "false"
      DB_MIN_CONNECTIONS: "2"
      DB_MAX_CONNECTIONS: "20"
      RUST_LOG: adelia=info,tower_http=info
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - generated-pages:/opt/adelia/generated
      - uploaded-media:/opt/adelia/data/uploads
    restart: unless-stopped

volumes:
  database-data:
  generated-pages:
  uploaded-media:
